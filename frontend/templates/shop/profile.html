{% extends 'shop/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-[#1e293b] mb-8">Mon Profil</h1>
    
    <div class="space-y-6">
        <!-- Profile Information -->
        <div class="bg-white rounded-lg shadow-sm border border-[#e2e8f0] p-6">
            <h2 class="text-xl font-semibold text-[#1e293b] mb-6">Informations personnelles</h2>
            
            <form method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-[#1e293b] mb-2">Nom complet</label>
                        <input type="text" value="{{ user.username }}" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-[#1e293b] mb-2">Email</label>
                        <input type="email" value="{{ user.email }}" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">
                    Mettre à jour les informations
                </button>
            </form>
        </div>
        
        <!-- Change Password -->
        <div class="bg-white rounded-lg shadow-sm border border-[#e2e8f0] p-6">
            <h2 class="text-xl font-semibold text-[#1e293b] mb-6">Changer le mot de passe</h2>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#1e293b] mb-2">Mot de passe actuel</label>
                    <input type="password" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-[#1e293b] mb-2">Nouveau mot de passe</label>
                    <input type="password" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-[#1e293b] mb-2">Confirmer le nouveau mot de passe</label>
                    <input type="password" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                </div>
                
                <button type="submit" class="btn-primary">
                    Changer le mot de passe
                </button>
            </form>
        </div>
        
        <!-- Delete Account -->
        <div class="bg-white rounded-lg shadow-sm border border-red-200 p-6">
            <h2 class="text-xl font-semibold text-red-600 mb-6">Supprimer le compte</h2>
            
            <p class="text-[#64748b] mb-4">
                Une fois votre compte supprimé, toutes ses données seront définitivement supprimées. 
                Cette action est irréversible.
            </p>
            
            <button class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                Supprimer mon compte
            </button>
        </div>
    </div>
</div>
{% endblock %}
