{% extends 'shop/base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-[#1e293b] mb-8">Votre Panier</h1>
    
    <div id="cart-items" class="bg-white rounded-lg shadow-sm border border-[#e2e8f0] p-8 mb-6">
        <div class="text-center py-8 text-[#64748b]">
            <svg class="w-16 h-16 mx-auto mb-4 text-[#94a3b8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <p class="text-lg mb-4">Votre panier est vide.</p>
            <a href="{% url 'shop:products' %}" class="btn-primary inline-block">Parcourir nos produits</a>
        </div>
    </div>
    
    <div id="cart-summary" class="hidden bg-white rounded-lg shadow-sm border border-[#e2e8f0] p-8 mb-6">
        <div class="flex justify-between items-center mb-4">
            <span class="text-lg font-semibold text-[#1e293b]">Total:</span>
            <span id="cart-total" class="text-2xl font-bold text-[#f97316]">0 FCFA</span>
        </div>
    </div>
    
    <div id="checkout-form" class="hidden bg-white rounded-lg shadow-sm border border-[#e2e8f0] p-8">
        <h2 class="text-2xl font-bold text-[#1e293b] mb-6">Informations de livraison</h2>
        
        <form method="POST" id="order-form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-[#1e293b] mb-2">Nom complet *</label>
                    <input type="text" name="customer_name" required class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-[#1e293b] mb-2">Email *</label>
                    <input type="email" name="customer_email" required class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#1e293b] mb-2">Téléphone *</label>
                <input type="tel" name="customer_phone" required class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-[#1e293b] mb-2">Adresse de livraison *</label>
                <textarea name="shipping_address" required rows="3" class="w-full px-4 py-2.5 border border-[#e2e8f0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f97316]/20 focus:border-[#f97316] bg-[#f8fafc] focus:bg-white transition-all"></textarea>
            </div>
            
            <input type="hidden" name="items" id="cart-items-json">
            <input type="hidden" name="total_amount" id="cart-total-amount">
            
            <button type="submit" class="w-full btn-primary py-3 rounded-lg">
                Commander
            </button>
        </form>
    </div>
</div>

<script>
// Simple cart management with localStorage
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
    const cartItemsDiv = document.getElementById('cart-items');
    const cartSummaryDiv = document.getElementById('cart-summary');
    const checkoutFormDiv = document.getElementById('checkout-form');
    
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = `
            <div class="text-center py-8 text-[#64748b]">
                <svg class="w-16 h-16 mx-auto mb-4 text-[#94a3b8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <p class="text-lg mb-4">Votre panier est vide.</p>
                <a href="{% url 'shop:products' %}" class="btn-primary inline-block">Parcourir nos produits</a>
            </div>
        `;
        cartSummaryDiv.classList.add('hidden');
        checkoutFormDiv.classList.add('hidden');
        return;
    }
    
    let total = 0;
    let itemsHtml = cart.map((item, index) => {
        total += item.price * item.quantity;
        return `
            <div class="flex items-center justify-between py-4 border-b border-[#e2e8f0]">
                <div class="flex-1">
                    <h3 class="font-semibold text-[#1e293b]">${item.name}</h3>
                    <p class="text-sm text-[#64748b]">${item.price} FCFA x ${item.quantity}</p>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-bold text-[#f97316]">${(item.price * item.quantity)} FCFA</span>
                    <button onclick="removeFromCart(${index})" class="text-red-600 hover:text-red-800 transition-colors">Supprimer</button>
                </div>
            </div>
        `;
    }).join('');
    
    cartItemsDiv.innerHTML = itemsHtml;
    document.getElementById('cart-total').textContent = total.toLocaleString('fr-FR') + ' FCFA';
    document.getElementById('cart-total-amount').value = total;
    document.getElementById('cart-items-json').value = JSON.stringify(cart);
    
    cartSummaryDiv.classList.remove('hidden');
    checkoutFormDiv.classList.remove('hidden');
}

function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

// Add to cart function (can be called from product pages)
function addToCart(product) {
    const existingItem = cart.find(item => item.product_id === product.id);
    
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({
            product_id: product.id,
            name: product.name,
            price: product.price,
            quantity: 1
        });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

// Form submission
document.getElementById('order-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    if (cart.length === 0) {
        alert('Votre panier est vide');
        return;
    }
    
    this.submit();
});

// Initial render
renderCart();
</script>
{% endblock %}
