{% extends 'shop/base.html' %}

{% block title %}Panier - TechStore{% endblock %}

{% block content %}
{% if error %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
    <strong class="font-bold">Erreur:</strong>
    <span class="block sm:inline">{{ error }}</span>
</div>
{% endif %}

<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Votre Panier</h1>
    
    <div id="cart-items" class="bg-white rounded-lg shadow p-8 mb-6">
        <div class="text-center py-8 text-gray-500">
            <p>Votre panier est vide.</p>
            <a href="{% url 'shop:products' %}" class="text-blue-600 hover:text-blue-800">Parcourir nos produits</a>
        </div>
    </div>
    
    <div id="cart-summary" class="hidden bg-white rounded-lg shadow p-8 mb-6">
        <div class="flex justify-between items-center mb-4">
            <span class="text-lg font-semibold">Total:</span>
            <span id="cart-total" class="text-2xl font-bold text-blue-600">0 FCFA</span>
        </div>
    </div>
    
    <div id="checkout-form" class="hidden bg-white rounded-lg shadow p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Informations de livraison</h2>
        
        <form method="POST" id="order-form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nom complet *</label>
                    <input type="text" name="customer_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                    <input type="email" name="customer_email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Téléphone *</label>
                <input type="tel" name="customer_phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Adresse de livraison *</label>
                <textarea name="shipping_address" required rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            
            <input type="hidden" name="items" id="cart-items-json">
            <input type="hidden" name="total_amount" id="cart-total-amount">
            
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors">
                Commander
            </button>
        </form>
    </div>
</div>

<script>
// Simple cart management with localStorage
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
    const cartItemsDiv = document.getElementById('cart-items');
    const cartSummaryDiv = document.getElementById('cart-summary');
    const checkoutFormDiv = document.getElementById('checkout-form');
    
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = `
            <div class="text-center py-8 text-gray-500">
                <p>Votre panier est vide.</p>
                <a href="{% url 'shop:products' %}" class="text-blue-600 hover:text-blue-800">Parcourir nos produits</a>
            </div>
        `;
        cartSummaryDiv.classList.add('hidden');
        checkoutFormDiv.classList.add('hidden');
        return;
    }
    
    let total = 0;
    let itemsHtml = cart.map((item, index) => {
        total += item.price * item.quantity;
        return `
            <div class="flex items-center justify-between py-4 border-b">
                <div class="flex-1">
                    <h3 class="font-semibold text-gray-900">${item.name}</h3>
                    <p class="text-sm text-gray-600">${item.price} FCFA x ${item.quantity}</p>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-bold text-blue-600">${(item.price * item.quantity)} FCFA</span>
                    <button onclick="removeFromCart(${index})" class="text-red-600 hover:text-red-800">Supprimer</button>
                </div>
            </div>
        `;
    }).join('');
    
    cartItemsDiv.innerHTML = itemsHtml;
    document.getElementById('cart-total').textContent = total.toLocaleString('fr-FR') + ' FCFA';
    document.getElementById('cart-total-amount').value = total;
    document.getElementById('cart-items-json').value = JSON.stringify(cart);
    
    cartSummaryDiv.classList.remove('hidden');
    checkoutFormDiv.classList.remove('hidden');
}

function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

// Add to cart function (can be called from product pages)
function addToCart(product) {
    const existingItem = cart.find(item => item.product_id === product.id);
    
    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({
            product_id: product.id,
            name: product.name,
            price: product.price,
            quantity: 1
        });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

// Form submission
document.getElementById('order-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    if (cart.length === 0) {
        alert('Votre panier est vide');
        return;
    }
    
    this.submit();
});

// Initial render
renderCart();
</script>
{% endblock %}
