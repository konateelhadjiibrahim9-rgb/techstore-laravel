{% extends 'shop/base.html' %}

{% block title %}Produits - TechStore{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-4">Nos Produits</h1>
    <div class="flex gap-4 mb-6">
        <input type="text" id="search" placeholder="Rechercher..." class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="category" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Toutes les catégories</option>
        </select>
    </div>
</div>

<div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div class="text-center py-12 col-span-full">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
        <p class="mt-4 text-gray-600">Chargement des produits...</p>
    </div>
</div>

<script>
    async function loadProducts() {
        try {
            const response = await fetch('/api/products/');
            const data = await response.json();
            
            if (data.error) {
                document.getElementById('products-grid').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-red-600">Erreur: ${data.error}</p>
                    </div>
                `;
                return;
            }
            
            const products = Array.isArray(data) ? data : (data.data || []);
            
            if (products.length === 0) {
                document.getElementById('products-grid').innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <p class="text-gray-600">Aucun produit disponible.</p>
                    </div>
                `;
                return;
            }
            
            const productsHtml = products.map(product => `
                <div class="bg-white rounded-lg shadow overflow-hidden hover:shadow-lg transition-shadow">
                    <div class="aspect-w-1 aspect-h-1 bg-gray-200">
                        ${product.image ? `<img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">` : '<div class="w-full h-48 flex items-center justify-center text-gray-400">Pas d\'image</div>'}
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-gray-900 mb-2">${product.name || 'Sans nom'}</h3>
                        <p class="text-sm text-gray-600 mb-2">${product.brand || ''}</p>
                        <p class="text-lg font-bold text-blue-600 mb-2">${formatPrice(product.price || 0)} FCFA</p>
                        <p class="text-sm ${product.stock_quantity > 0 ? 'text-green-600' : 'text-red-600'} mb-4">
                            ${product.stock_quantity > 0 ? `En stock (${product.stock_quantity})` : 'Rupture de stock'}
                        </p>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors ${product.stock_quantity <= 0 ? 'opacity-50 cursor-not-allowed' : ''}" 
                                ${product.stock_quantity <= 0 ? 'disabled' : ''}>
                            ${product.stock_quantity > 0 ? 'Ajouter au panier' : 'Indisponible'}
                        </button>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('products-grid').innerHTML = productsHtml;
            
            // Populate categories
            const categories = [...new Set(products.map(p => p.category?.name).filter(Boolean))];
            const categorySelect = document.getElementById('category');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
        } catch (error) {
            document.getElementById('products-grid').innerHTML = `
                <div class="col-span-full text-center py-12">
                    <p class="text-red-600">Erreur de chargement: ${error.message}</p>
                </div>
            `;
        }
    }
    
    function formatPrice(price) {
        return new Intl.NumberFormat('fr-FR', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }).format(price);
    }
    
    loadProducts();
</script>
{% endblock %}
